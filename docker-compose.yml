services:
  # 1. The Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Cache & Queue (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      

  # 3. The Backend API (FastAPI)
  backend:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. The Background Worker (Celery)
  # NOTE: You will need to create src/worker.py later for this to run
  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  # 5. The Celery Beat scheduler — fires periodic tasks (daily briefings,
  # task reminder ticks). Must run as a separate container, otherwise
  # schedules duplicate when the worker scales horizontally.
  beat:
    build: .
    command: celery -A src.worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - worker
      - redis

  # NOTE: The Next.js frontend runs on the host (not in Docker).
  # Next's file watcher and .next cache are unreliable on this project's
  # bind-mounted NTFS path. See README §6.4 for the host-side dev command.

volumes:
  postgres_data: