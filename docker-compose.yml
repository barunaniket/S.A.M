services:
  # 1. The Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Cache & Queue (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      

  # 3. The Backend API (FastAPI)
  backend:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. The Background Worker (Celery)
  # NOTE: You will need to create src/worker.py later for this to run
  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  # 5. The Celery Beat scheduler — fires periodic tasks (daily briefings,
  # task reminder ticks). Must run as a separate container, otherwise
  # schedules duplicate when the worker scales horizontally.
  beat:
    build: .
    command: celery -A src.worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - worker
      - redis

  # 6. Telegram long-poller — fetches updates from the Bot API and hands
  # them to telegram_orchestrator.handle_update. Kept out of the FastAPI
  # container so a stalled long-poll cannot pin a request worker.
  # If TELEGRAM_BOT_TOKEN is unset the poller exits cleanly at startup —
  # safe to leave in compose for setups that don't use Telegram yet.
  telegram:
    build: .
    command: python -m src.services.telegram_poller
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # 7. Telegram outbound queue worker — drains telegram_queue Redis list and
  # ships messages out via the Bot API. Mirror of the WhatsApp queue worker
  # (which currently piggy-backs on Celery via send_whatsapp).
  telegram_queue_worker:
    build: .
    command: python -c "from src.services.telegram_queue import process_telegram_queue; process_telegram_queue()"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # NOTE: The Next.js frontend runs on the host (not in Docker).
  # Next's file watcher and .next cache are unreliable on this project's
  # bind-mounted NTFS path. See README §6.4 for the host-side dev command.

volumes:
  postgres_data: