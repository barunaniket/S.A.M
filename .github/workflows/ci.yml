name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + RBAC audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: RBAC route audit
        run: python scripts/audit_route_rbac.py

      - name: Run tests
        run: pytest -q

  lint:
    name: Lint + types (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Report-only for now (see pyproject.toml). Flip continue-on-error to
      # false once the codebase is clean to make these blocking gates.
      - name: ruff check
        continue-on-error: true
        run: ruff check .

      - name: ruff format --check
        continue-on-error: true
        run: ruff format --check .

      - name: mypy
        continue-on-error: true
        run: mypy src
